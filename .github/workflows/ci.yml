name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # tests/agency-rls.sql and tests/project-documents-rls.sql are not run here.
      # They exercise RLS policies and security-definer RPCs and need auth.uid() /
      # the authenticated|anon|service_role roles, which only a real Supabase
      # Postgres instance provides (the official local stack via `supabase start`,
      # not a plain postgres: service container faking the auth schema). Wiring
      # that up needs validating against an actual Supabase project before it can
      # run unattended in CI, so for now run them manually — see README.md.
